name: Deploy web to Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload to Strato via SFTP
        timeout-minutes: 5
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          # lftp reads the password from LFTP_PASSWORD (--env-password),
          # so special characters like commas in it don't matter
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_DIR: ${{ vars.SFTP_DIR || '/' }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$SFTP_USER" --env-password "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=accept-new';
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            mirror --reverse --delete --verbose --parallel=4 dist/ $SFTP_DIR;
            bye"
